<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="title desc">
  <title id="title">Animated enchanted manuscript</title>
  <desc id="desc">A glowing open book surrounded by curling vines, runes, and drifting magical sparks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#071c18"/><stop offset=".5" stop-color="#173f2d"/><stop offset="1" stop-color="#071c18"/>
    </linearGradient>
    <radialGradient id="light"><stop stop-color="#e7f7a8" stop-opacity=".65"/><stop offset="1" stop-color="#e7f7a8" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1200" height="170" rx="18" fill="url(#bg)"/>
  <ellipse cx="600" cy="116" rx="220" ry="65" fill="url(#light)">
    <animate attributeName="opacity" values=".5;.9;.5" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <path d="M600 130c-62-31-124-33-189-8V63c69-25 132-17 189 17z" fill="#d8c38d" stroke="#8b7040" stroke-width="4"/>
  <path d="M600 130c62-31 124-33 189-8V63c-69-25-132-17-189 17z" fill="#ead9a7" stroke="#8b7040" stroke-width="4"/>
  <path d="M600 81v49" stroke="#8b7040" stroke-width="3"/>
  <g fill="none" stroke="#5f9b58" stroke-width="5" stroke-linecap="round">
    <path d="M410 123C315 150 248 110 221 64C190 12 126 26 97 63"/>
    <path d="M790 123C885 150 952 110 979 64C1010 12 1074 26 1103 63"/>
  </g>
  <g fill="#91c66e">
    <ellipse cx="257" cy="111" rx="13" ry="6" transform="rotate(25 257 111)"/>
    <ellipse cx="189" cy="44" rx="13" ry="6" transform="rotate(-28 189 44)"/>
    <ellipse cx="943" cy="111" rx="13" ry="6" transform="rotate(-25 943 111)"/>
    <ellipse cx="1011" cy="44" rx="13" ry="6" transform="rotate(28 1011 44)"/>
  </g>
  <g fill="#e9ff91" filter="url(#glow)">
    <circle cx="475" cy="70" r="3"><animate attributeName="cy" values="70;36;70" dur="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="55" r="2.5"><animate attributeName="cy" values="55;22;55" dur="4.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="645" cy="62" r="3"><animate attributeName="cy" values="62;29;62" dur="3.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".15;1;.15" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="728" cy="75" r="2.5"><animate attributeName="cy" values="75;39;75" dur="4.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.15;1" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#c8e6a0" font-family="serif" font-size="18" text-anchor="middle">
    <text x="520" y="52">✦<animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></text>
    <text x="600" y="34">◇<animate attributeName="opacity" values="1;.25;1" dur="4s" repeatCount="indefinite"/></text>
    <text x="680" y="52">✦<animate attributeName="opacity" values=".25;1;.25" dur="2.6s" repeatCount="indefinite"/></text>
  </g>
</svg>
