<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Animated enchanted forest and castle</title>
  <desc id="desc">A moonlit castle above layers of pine trees, drifting mist, twinkling stars, and floating fireflies.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071c18"/>
      <stop offset=".55" stop-color="#123b2d"/>
      <stop offset="1" stop-color="#31533c"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#fffbd2" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#d8e7b0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#b8d59a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#d7ead9" stop-opacity="0"/>
      <stop offset=".45" stop-color="#d7ead9" stop-opacity=".22"/>
      <stop offset=".75" stop-color="#d7ead9" stop-opacity=".08"/>
      <stop offset="1" stop-color="#d7ead9" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
    <path id="pine" d="M0 54 18 23h-9L23 0l14 23h-9l18 31H29v18H17V54z"/>
  </defs>
  <rect width="1200" height="280" rx="18" fill="url(#sky)"/>
  <circle cx="925" cy="70" r="78" fill="url(#moonGlow)">
    <animate attributeName="opacity" values=".72;1;.72" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="925" cy="70" r="37" fill="#eef0c6"/>
  <g fill="#dff7cf">
    <circle cx="110" cy="38" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="72" r="1.8"><animate attributeName="opacity" values="1;.15;1" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="438" cy="35" r="2.2"><animate attributeName="opacity" values=".15;1;.15" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="58" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="43" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#0a1d18">
    <path d="M708 184v-68h18v-22l10-18 10 18v22h20v-35h18V58l10-18 10 18v23h19v35h20V87l10-18 10 18v29h18v68z"/>
    <path d="M680 184h230l-28-35H708z"/>
  </g>
  <g fill="#f3c969">
    <rect x="781" y="96" width="7" height="12" rx="3"><animate attributeName="opacity" values=".45;1;.45" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="824" y="130" width="7" height="12" rx="3"><animate attributeName="opacity" values="1;.4;1" dur="4s" repeatCount="indefinite"/></rect>
  </g>
  <path d="M0 190Q180 135 355 183T705 174T1200 166V280H0Z" fill="#173729"/>
  <g fill="#102c23" opacity=".9">
    <use href="#pine" x="18" y="126"/><use href="#pine" x="84" y="145" transform="scale(1.15)"/><use href="#pine" x="226" y="132"/><use href="#pine" x="330" y="147" transform="scale(.92)"/>
    <use href="#pine" x="690" y="143"/><use href="#pine" x="1015" y="126" transform="scale(1.12)"/><use href="#pine" x="1120" y="145"/>
  </g>
  <path d="M0 221Q175 173 340 220T690 207T1200 214V280H0Z" fill="#0b241c"/>
  <g fill="#071b16">
    <use href="#pine" x="5" y="172" transform="scale(1.25)"/><use href="#pine" x="145" y="181"/><use href="#pine" x="260" y="164" transform="scale(1.3)"/>
    <use href="#pine" x="445" y="184"/><use href="#pine" x="565" y="166" transform="scale(1.2)"/><use href="#pine" x="930" y="176"/>
    <use href="#pine" x="1060" y="162" transform="scale(1.28)"/>
  </g>
  <g opacity=".75">
    <ellipse cx="-110" cy="205" rx="260" ry="28" fill="url(#mist)">
      <animateTransform attributeName="transform" type="translate" values="0 0;1450 0" dur="22s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="-430" cy="232" rx="330" ry="24" fill="url(#mist)">
      <animateTransform attributeName="transform" type="translate" values="0 0;1750 0" dur="31s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <g fill="#d9ff72" filter="url(#glow)">
    <circle cx="165" cy="205" r="3"><animate attributeName="cy" values="205;187;205" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="395" cy="224" r="2.5"><animate attributeName="cy" values="224;199;224" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.15;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="990" cy="202" r="3"><animate attributeName="cy" values="202;180;202" dur="4.7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".1;1;.1" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
